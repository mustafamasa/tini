[package]
name = "tini"
version = "0.1.0"
description = "Tını: a Turkish voice design and narration studio"
edition = "2021"
license = "Apache-2.0"

[lib]
name = "tini_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tini-core = { path = "../../crates/tini-core" }
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
