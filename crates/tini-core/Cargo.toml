[package]
name = "tini-core"
version = "0.1.0"
edition = "2021"
description = "Tını core: voice design, reading and cloning with VoxCPM2 (official VoxCPM), job queue and history"
license = "Apache-2.0"

[lib]
name = "tini_core"

[[bin]]
name = "tini-cli"
path = "src/bin/tini-cli.rs"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
hex = "0.4"
hound = "3.5"
mp3lame-encoder = "0.2"
rand = "0.8"
realfft = "3"
regex = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
symphonia = { version = "0.5", features = ["all"] }
thiserror = "2"
tiny_http = "0.12"
ureq = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"
